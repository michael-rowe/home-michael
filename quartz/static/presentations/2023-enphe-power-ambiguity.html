<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
  <title>With great power comes great ambiguity</title>
  <meta property="og:title" content="With great power comes great ambiguity" />
  <meta property="og:type" content="website" />
  <style>
    :root { --bg: #0b0b0d; --ui: rgba(255,255,255,0.85); --ui-bg: rgba(0,0,0,0.35); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    #stage img { display: none; max-width: 100%; max-height: 100%; width: auto; height: auto; }
    #stage img.active { display: block; }
    .nav { position: absolute; top: 0; height: 100%; width: 18%; border: 0; background: transparent; cursor: pointer; opacity: 0; }
    .nav:focus-visible { opacity: 1; outline: 2px solid var(--ui); }
    #prev { left: 0; }
    #next { right: 0; }
    #osc {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 14px;
      padding: 6px 14px; border-radius: 999px;
      background: var(--ui-bg); color: var(--ui);
      font-size: 14px; backdrop-filter: blur(4px);
      opacity: 0; transition: opacity .25s linear;
    }
    body:hover #osc, #osc:focus-within { opacity: 1; }
    #osc button { appearance: none; border: 0; background: transparent; color: var(--ui); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; }
    #osc button:hover { color: #fff; }
    #counter { font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; }
  </style>
</head>
<body>
  <div id="stage" aria-live="polite"></div>

  <button id="prev" class="nav" aria-label="Previous slide"></button>
  <button id="next" class="nav" aria-label="Next slide"></button>

  <div id="osc">
    <button id="osc-prev" aria-label="Previous slide">&#8249;</button>
    <span id="counter">1 / 17</span>
    <button id="osc-next" aria-label="Next slide">&#8250;</button>
    <button id="osc-full" aria-label="Toggle full screen">&#9974;</button>
  </div>

  <script>
    (function () {
      var TOTAL = 17;
      var stage = document.getElementById("stage");
      var counter = document.getElementById("counter");
      var current = 0;

      // Build image elements
      for (var i = 1; i <= TOTAL; i++) {
        var img = document.createElement("img");
        var n = i < 10 ? "0" + i : "" + i;
        img.src = "2023-enphe-power-ambiguity/slide-" + n + ".png";
        img.alt = "Slide " + i + " of " + TOTAL;
        img.loading = i === 1 ? "eager" : "lazy";
        if (i === 1) img.className = "active";
        stage.appendChild(img);
      }
      var slides = stage.querySelectorAll("img");

      function show(n) {
        current = Math.max(0, Math.min(TOTAL - 1, n));
        for (var i = 0; i < slides.length; i++) slides[i].classList.toggle("active", i === current);
        counter.textContent = (current + 1) + " / " + TOTAL;
      }
      function next() { show(current + 1); }
      function prev() { show(current - 1); }

      document.getElementById("next").addEventListener("click", next);
      document.getElementById("prev").addEventListener("click", prev);
      document.getElementById("osc-next").addEventListener("click", next);
      document.getElementById("osc-prev").addEventListener("click", prev);
      document.getElementById("osc-full").addEventListener("click", function () {
        if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); }
        else { document.exitFullscreen(); }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { next(); e.preventDefault(); }
        else if (e.key === "ArrowLeft" || e.key === "PageUp") { prev(); e.preventDefault(); }
        else if (e.key === "Home") { show(0); }
        else if (e.key === "End") { show(TOTAL - 1); }
        else if (e.key === "f" || e.key === "F") { document.getElementById("osc-full").click(); }
      });

      show(0);
    })();
  </script>
</body>
</html>
