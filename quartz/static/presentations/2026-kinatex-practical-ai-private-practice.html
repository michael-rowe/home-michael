<h2 id="ai-now-works-at-a-clinical-level">AI now works at a clinical level</h2>
<ul>
<li>In simulated consultations, a diagnostic AI took histories and reached diagnoses at least as well as primary care doctors (Tu et al., 2025)</li>
<li>Doctors working with GPT-4 reached the same standard as GPT-4 working alone (Goh et al., 2025)</li>
<li>ChatGPT and DeepSeek answered 60 rehabilitation questions to a standard rated above that of final-year physiotherapy students (Michou et al., 2026)</li>
<li>AI replies were rated more empathetic than clinicians' in 13 of 15 studies (Howcroft et al., 2025)</li>
</ul>
</section>

<h2 id="ai-is-already-improving-care-for-real-patients">AI is already improving care for real patients</h2>
<ul>
<li><strong>Emergency department second opinions</strong> : the right diagnosis at triage in 66% of cases, where the two attending physicians on the same cases reached 54% and 48% (Brodeur et al., 2026a)</li>
<li><strong>Primary care</strong> : 100 patients took a pre-visit history with an AI; the final diagnosis was on its list in 90% of cases (Brodeur et al., 2026b)</li>
<li><strong>Nursing</strong> : an AI reading patterns in nurses' documentation; 35.6% lower risk of in-hospital death across 74 units (Rossetti et al., 2025)</li>
<li><strong>Allied health private practice</strong> : 119 clinicians used an AI scribe for three months; less time on notes and letters, less charting after hours, and a better therapeutic relationship by clinicians' and patients' accounts (Evans et al., 2025)</li>
</ul>
</section>

<h2 id="why-people-with-the-ai-did-worse">Why people with the AI did worse</h2>
<ul>
<li><strong>They left out details that mattered</strong> : the AI can only reason from what it's told</li>
<li><strong>They asked closed questions</strong>, e.g. &quot;Could this be stress?&quot; : a yes-or-no question limits what the AI can say back</li>
<li><strong>They didn't pick the right answer when it was offered</strong> : choosing between two or three conditions takes clinical knowledge</li>
<li><strong>The AI didn't always help them</strong> : it sometimes misread what it was told, or had the right answer and didn't make it clear</li>
</ul>
<p>How you ask decides much of what you get back; that's what today practises.</p>
</section>

<h2 id="what-this-means-for-your-practice">What this means for your practice</h2>
<ul>
<li>AI can already draft much of the writing, searching and planning around your clinical work, and on some clinical tasks it matches clinicians</li>
<li>Its output depends on the context it's given, and you have the context about <em>this</em> patient, <em>this</em> clinic, and <em>this</em> community</li>
<li>The judgement about what's right for the person in front of you comes from you</li>
<li>Today covers some of the work around that judgement: communicating, learning, administration, building a service</li>
</ul>
</section>

<header>§02 · how AI works</header>

<h1 id="how-ai-works">How AI works</h1>
<ul>
<li><strong>What it can see</strong> : the model works only from its training and what's in the conversation, which is why the context you give it matters</li>
<li><strong>What it can't do</strong> : it doesn't learn from you, and it knows nothing about your clinic or your patients unless you tell it</li>
<li><strong>Why it matters today</strong> : almost every habit in the four sessions follows from these two points</li>
</ul>
</section>

<header><em>§01 why it matters</em> <strong>§02 how AI works</strong> <em>§03 patient education</em> <em>§04 development</em> <em>§05 admin</em> <em>§06 business</em> <em>§07 patients' AI</em></header>
<h2 id="ai-runs-on-tokens">AI runs on tokens</h2>
<ul>
<li><strong>Tokens</strong> : fragments of words; the model predicts the next one, then the next, over and over</li>
<li><strong>Next-token prediction</strong> : enough to produce reasoning, planning and multi-step work</li>
<li><strong>Training</strong> : done once, months ago, on an enormous body of text, producing a fixed model with an end date</li>
<li><strong>Inference</strong> : what happens when you type; the model doesn't learn from you, and nothing you say changes it</li>
</ul>
</section>

<header><em>§01 why it matters</em> <strong>§02 how AI works</strong> <em>§03 patient education</em> <em>§04 development</em> <em>§05 admin</em> <em>§06 business</em> <em>§07 patients' AI</em></header>
<h2 id="ai-sees-only-the-conversation">AI sees only the conversation</h2>
<ul>
<li><strong>Context window</strong> : everything the model can see at once, i.e. your prompt, its replies, anything you paste or upload (also, <em>custom instructions</em>)</li>
<li><strong>Size</strong> : thousands of pages, e.g. your patient information pack, a clinical guideline and your policies all at once, so you can ask it to compare them</li>
<li><strong>A new conversation</strong> : starts blank</li>
<li><strong>&quot;Memory&quot;</strong> : a feature built on top; text is saved and handed back to the model</li>
<li><strong>Long threads</strong> : the window fills up, and earlier material fades</li>
</ul>
</section>

<h2 id="ai-can-work-with-more-than-text">AI can work with more than text</h2>
<ul>
<li><strong>Images</strong> : a photo of a blank intake form, the whiteboard after a team meeting, a letter from an insurer</li>
<li><strong>Audio</strong> : a voice note recorded after a long day, turned into a to-do list; or a spoken conversation in voice mode</li>
<li><strong>Video</strong> : a clip of you demonstrating a home exercise, checked against the written instructions you give patients</li>
<li>It reads a screenshot of a web page as a page: layout, hierarchy, what catches the eye first</li>
<li>It's most useful when it interprets something real you've given it</li>
</ul>
</section>

<h2 id="which-tool-my-experience">Which tool: my experience</h2>
<ul>
<li><strong>ChatGPT</strong> : the most familiar; a good all-rounder, with voice and image creation on the free tier</li>
<li><strong>Claude</strong> : my choice for long documents and careful writing; tighter free-tier limits but still substantial</li>
<li><strong>Gemini</strong> : free with any Google account; includes Deep Research on the free tier, capped</li>
<li><strong>Copilot</strong> : may come with your clinic's Microsoft 365 account, possibly with data protections the others lack</li>
</ul>
<p>The leading models are now close in raw capability; what separates them is the features, limits and data terms around them.</p>

<ul>
<li><strong>Patient education</strong> : the materials you give patients, i.e. handouts, home programmes, explanations of their condition</li>
<li><strong>The method</strong> : start with a weak prompt and improve it step by step, then apply the same habits to an exercise programme</li>
<li><strong>The check</strong> : compare what AI gives you against the standard you're accountable to</li>
</ul>

<h2 id="what-can-be-improved">What can be improved?</h2>
<blockquote>
<p>That's too generic; it could be for any clinic. What do you need to know about me and my patients to make it specific?</p>
</blockquote>
<ul>
<li>Treat the first response as a starting point</li>
<li>Telling AI what's wrong with a draft is a normal move; it's how you get to something usable</li>
<li>Notice what it asks for: who your patients are, what they've tried, what you want them to do next, how you want to sound</li>
</ul>
</section>

<h2 id="let-ai-interview-you">Let AI interview you</h2>
<blockquote>
<p>Before we continue, ask me the 5 questions that would most change your answer.</p>
</blockquote>
<ul>
<li>You can use AI to build a good prompt; you don't need to know the exact shape in advance</li>
<li>Works on any task: a handout, a letter, a programme, a policy</li>
<li>If its questions seem off the point, your request was probably unclear; answer them anyway, or restate what you want</li>
<li>For bigger tasks, ask for one question at a time: you answer each properly, and each question builds on your last answer</li>
</ul>
</section>

<h2 id="the-structure-of-a-prompt">The structure of a prompt</h2>
<p><strong>Role · Context · Task · Constraints · Output</strong></p>
<blockquote>
<p>You're an experienced clinician in musculoskeletal rehabilitation. <em>(role)</em><br />
I'm a kinesiologist in a Montreal clinic. My patient is 64, has knee osteoarthritis, and wants to keep hiking but is nervous about pain. <em>(context)</em><br />
Write a six-week home exercise programme. <em>(task)</em><br />
Twenty minutes a day, a chair and a resistance band only; include how to tell acceptable pain from a warning sign. <em>(constraints)</em><br />
Give it as a table: week, exercises, sets and reps, when to progress. <em>(output)</em></p>
</blockquote>
</section>

<h2 id="or-ask-ai-to-write-the-prompt">Or ask AI to write the prompt</h2>
<blockquote>
<p>I want to [describe the outcome you want] but I'm not sure how to ask for it. Write the prompt for me, then tell me what you'd need to know to make it better.</p>
</blockquote>
<ul>
<li>Not every prompt needs all five; context and constraints are the two most often missing</li>
<li>Compare what it gives you with the five-part structure</li>
<li>Knowing the structure is how you judge whether its prompt is any good</li>
</ul>
</section>

<h2 id="your-own-exercise-programme">Your own exercise programme</h2>
<p>The aim: practise the five-part structure on the kind of patient you see every week (10 minutes).</p>
<ul>
<li>Invent a patient typical of your caseload: a condition you see often, their age, their goal, what worries them</li>
<li>Write a prompt for the programme you'd give that patient</li>
<li>Ask for dosage, progressions, and the signs that mean the patient should stop and get in touch</li>
<li>Then ask:</li>
</ul>
<blockquote>
<p>What would you need to know about this patient to make this safer?</p>
</blockquote>
</section>

<h2 id="check-it-against-the-guideline">Check it against the guideline</h2>
<p>The aim: AI drafts from everything it has read, good and bad. A guideline is the standard you're accountable to, so use it as the reference and make the AI show where its draft departs from it.</p>
<blockquote>
<p>Compare this programme with [named guideline] for [condition]. List every place it departs from the guideline, and quote the guideline's wording for each.</p>
</blockquote>
<ul>
<li>What to look for: outdated advice, invented references, confident claims with nothing behind them, dosage that's too aggressive or too timid</li>
<li>You decide whether to change the output or set it aside</li>
</ul>
</section>

<h2 id="dos-and-donts">Do's and don'ts</h2>
<ul>
<li><strong>Do</strong> give AI context about you and your patients before asking for output</li>
<li><strong>Do</strong> invite clarifying questions</li>
<li><strong>Don't</strong> put in anything from a real patient's record; invent a typical patient instead (more in Session 3)</li>
<li><strong>Don't</strong> accept the first output as final</li>
<li><strong>Don't</strong> assume it knows local guidelines, regulation or insurer requirements unless you tell it</li>
</ul>
</section>

<h2 id="session-1-summary">Session 1: Summary</h2>
<ul>
<li>A bare request gets a generic answer; context about you and your patients turns it into something you'd use</li>
<li>When you're not sure what the AI needs, ask it to interview you</li>
<li>Role, context, task, constraints, output: context and constraints are the parts most often missing</li>
<li>AI drafts from everything it has read; check what you'd act on against the standard you're accountable to</li>
<li>What goes to the patient is your decision</li>
</ul>
<p>The habit to keep: start with context.</p>
<p><strong>Break (10 minutes)</strong></p>
</section>

<h2 id="bring-yourself-into-the-conversation">Bring yourself into the conversation</h2>
<ul>
<li>Ask most tools for &quot;a summary&quot; and you get the same generic, surface-level summary everyone else gets</li>
<li>What makes it useful is what you bring: your profession, your patients, what you're unsure about, what you'd change</li>
<li>Every question you ask puts more of your context into the window, and the answers become more specific to you</li>
<li>That's true for everything in this session: papers, guidelines, learning plans</li>
</ul>
</section>

<h2 id="start-a-project-for-your-learning-goal">Start a project for your learning goal</h2>
<ul>
<li><strong>Projects</strong> (Claude), <strong>Custom GPTs</strong> (ChatGPT), and <strong>Gems</strong> (Gemini) hold files, instructions and past work around one goal, e.g. &quot;improve my management of persistent neck pain&quot;</li>
<li>Save what matters into the project: papers, guidelines, summaries, your learning plan</li>
<li>Start a new conversation inside the project for each task; it begins with the project's context, without the clutter of a long thread</li>
<li>Shorter threads also stretch free-tier limits further, and earlier material doesn't fade as much</li>
<li>Free tiers limit how many projects you can have; one per learning goal is enough</li>
</ul>
</section>

<h2 id="have-a-conversation-with-a-paper">Have a conversation with a paper</h2>
<blockquote>
<p>I've attached a paper on [acupuncture or massage for chronic neck pain]. I'm a [profession]. Before you summarise anything, let me ask you about it.</p>
</blockquote>
<p>Then ask (10 minutes):</p>
<ul>
<li>What did they measure, and what did they leave out?</li>
<li>Would this apply to a typical patient of mine who [is 72 / works nights / has had pain for ten years]?</li>
<li>Can you explain the statistics in plain language?</li>
<li>Where do the authors claim more than their data shows?</li>
</ul>
<p>Then ask for the summary (later, compare it to a simple request for a summary)</p>
</section>

<h2 id="two-ways-to-judge-the-conversation">Two ways to judge the conversation</h2>
<ul>
<li>We rarely ask a well-read colleague for the numbers when they say &quot;most patients&quot; or &quot;works better&quot;; we judge them by what we know of them and the topic
<ul>
<li><strong>Facts</strong> : for any claim you'd act on, find the sentence in the paper yourself; watch for overstated effects, subgroups presented as the main result, missing limitations</li>
<li><strong>Value</strong> : did it change how you think about the paper? What questions did it raise that you hadn't considered? Would you bring it up with a colleague?</li>
</ul>
</li>
<li>Bring the same mix of trust and scrutiny here: check what you'd act on, and take the rest as a conversation worth having</li>
</ul>
</section>

<h2 id="ask-it-for-references">Ask it for references</h2>
<blockquote>
<p>Search PubMed and Google Scholar for five peer-reviewed papers on [shared decision-making in rehabilitation] published since 2020. For each, give the full reference, a one-line summary of the finding, and a link to the paper.</p>
</blockquote>
<ul>
<li>Naming the databases, a date range and asking for links makes every reference easy to check</li>
<li>Look each one up: does it exist, are the authors and year right, does it say what the AI claims?</li>
<li>Most tools now search the web when they judge it useful; asking it to search makes sure it does</li>
</ul>
</section>

<h2 id="putting-a-guideline-into-practice">Putting a guideline into practice</h2>
<blockquote>
<p>Here is a recommendation from [the World Falls Guidelines] on [strength and balance training for older adults at risk of falling]. I'm a [profession] in a private clinic with [30-minute appointments, patients who self-refer, no group space]. Help me work out what I'd change on Monday: what I'd do differently, what gets in the way, how I'd explain it to a patient, and how I'd know it was working.</p>
</blockquote>
<ul>
<li>Use a guideline from your own field (10 minutes)</li>
</ul>
</section>

<h2 id="commission-it-like-a-scoping-review">Commission it like a scoping review</h2>
<ul>
<li><strong>Sources</strong> : name them, e.g. peer-reviewed studies and named guideline bodies, a date range, the kinds of study you'll accept</li>
<li><strong>The question</strong> : population, intervention, outcome, setting</li>
<li><strong>The plan</strong> : Deep Research proposes a search plan first; edit it before it runs (you can approximate this without Deep Research)</li>
<li><strong>The evidence</strong> : ask how strong it is and where the gaps are, as well as what it found (the reliability of this kind of prompt is debated)</li>
<li><strong>The check</strong> : trace three claims back to their sources</li>
</ul>
</section>

<h2 id="plan-your-own-learning">Plan your own learning</h2>
<blockquote>
<p>I want to develop my practice in [area]. Ask me questions one at a time to find out what I already know and where my gaps are. Then give me a three-month learning plan, with free sources where possible, and ten questions I could use to test myself at the end.</p>
</blockquote>
<ul>
<li>One question at a time keeps it an interview, so the plan comes from your answers</li>
<li>Push back on sources you can't access or don't trust</li>
</ul>
</section>

<h2 id="take-the-plan-with-you">Take the plan with you</h2>
<ul>
<li>A long-term plan outlives any single conversation, so get it out of the chat (the same applies for generated context)</li>
<li>Ask for it as a downloadable file, a checklist to paste into your notes, or a calendar of dates</li>
<li>Save it into your project, so every new conversation there starts with the plan</li>
<li>Ask for a <strong>restart prompt</strong>, i.e. a paragraph that tells a new conversation where you're up to (like a handover report):</li>
</ul>
<blockquote>
<p>Write a short prompt I can paste into a new conversation in a month's time, so you can pick up this plan where I left off.</p>
</blockquote>

<h2 id="session-2-summary">Session 2: Summary</h2>
<ul>
<li>Generic questions get generic summaries; your questions make the answers specific to you</li>
<li>A project keeps one goal's files and instructions together; start each task in a new conversation inside it</li>
<li>Judge a conversation on facts (find the sentence yourself) and on value (did it change your thinking?)</li>
<li>Name the databases and dates, and ask for links, so every reference can be checked</li>
<li>Long-term work outlives a conversation: save it as a file, and keep a restart prompt</li>
</ul>
<p>The habit to keep: bring yourself into the conversation.</p>
<p><strong>Break (10 minutes)</strong></p>

<h2 id="ai-can-save-you-the-most-time-on-admin">AI can save you the most time on admin</h2>
<ul>
<li>Much of a clinician's week goes on writing that isn't treatment: reports, letters, emails, forms</li>
<li>Most of it follows patterns, which is what AI does well</li>
<li>Mistakes in an admin draft are easy to spot and cheap to fix, so it's a good place to build the habits from Sessions 1 and 2</li>
<li>It's also where patient information is closest to hand, so the privacy risk is highest</li>
<li>So we start with what can and can't go into an AI tool, then put AI to work within those limits</li>
</ul>
</section>

<h2 id="kinatexs-rules-for-ai">Kinatex's rules for AI</h2>
<ul>
<li><strong>Plume IA</strong> : Kinatex's approved tool for clinical notes, for OTs, physiotherapists and physiotherapy technologists</li>
<li><strong>Clinical data</strong> : only in AI tools Kinatex has approved; never in the free ChatGPT, Claude or Gemini accounts we're using today</li>
<li><strong>Responsibility</strong> : every note, recommendation, plan and report stays yours, whoever or whatever drafted it</li>
<li><strong>Everything else today</strong> : general AI tools, with no patient data at all (Kinatex, Procédure encadrant le logiciel Plume)</li>
</ul>
<p>Canada has no federal AI law yet. Canada's privacy commissioners say personal information needs consent and safeguards before it goes into a generative AI tool (Office of the Privacy Commissioner of Canada, 2023).</p>
</section>

<h2 id="use-an-invented-patient">Use an invented patient</h2>
<blockquote>
<p><strong>Don't</strong><br />
Here are my notes on a patient: [name], 54, Plateau Mont-Royal, CNESST claim, seen 12 Mar for…</p>
</blockquote>
<blockquote>
<p><strong>Do</strong><br />
A typical patient of mine might be someone in their mid-fifties, a manual worker, off work after a lifting injury, with [the kind of presentation I see often]…</p>
</blockquote>
<ul>
<li>An invented patient typical of your caseload gives AI everything it needs to help you think</li>
<li>Free tools send what you type to servers outside Quebec, and some train on it by default; check your settings</li>
</ul>
</section>

<h2 id="templates-kept-in-a-project">Templates, kept in a project</h2>
<blockquote>
<p>I regularly write [letters to referring physicians / discharge summaries]. Before you draft anything, ask me who reads it and what they need to decide. Then build a template: headings, what goes under each one, and [brackets] for every patient detail. I'll fill the brackets in myself, outside this chat.</p>
</blockquote>
<ul>
<li>e.g. a letter to a referring physician, using the Kinatex follow-up note headings: subjective, objective, analysis, plan, questions and recommendations</li>
<li>A project holds your templates, so each new document starts from the right one</li>
<li>If you keep making the same changes, describe them, ask the AI to update the template, and replace the old one in the project (10 minutes)</li>
</ul>
</section>

<h2 id="an-ai-policy-for-your-patients">An AI policy for your patients</h2>
<blockquote>
<p>Create an outline for an &quot;AI use and disclosure policy&quot; for a private rehabilitation clinic in Quebec. Cover what AI is and isn't used for, what patient information never goes into AI tools, and how patients can ask questions. Use plain language a patient would read. Note where Quebec or Canadian privacy law applies, and flag anything I should check with a professional.</p>
</blockquote>
<ul>
<li>Edit the prompt so it describes what's true in your clinic</li>
<li>Kinatex's Plume procedure tells staff what they may do with AI; this policy tells patients, in plain language, how AI is and isn't used in their care</li>
</ul>
</section>

<h2 id="session-3-summary">Session 3: Summary</h2>
<ul>
<li>Clinical data goes only into tools Kinatex has approved; everything else today uses no patient data at all</li>
<li>An invented patient typical of your caseload gives AI everything it needs to help you</li>
<li>A template holds the structure; you add the patient details yourself, outside the chat</li>
<li>Admin writing follows patterns, which is where AI saves time soonest</li>
<li>Patients should be able to read, in plain language, how AI is used in their care</li>
</ul>
<p>The habit to keep: invent the patient, so real records stay where they belong.</p>
<p><strong>Break (10 minutes)</strong></p>

<h2 id="most-small-businesses-now-use-ai">Most small businesses now use AI</h2>
<ul>
<li>89% of small businesses use AI, up from 36% in 2023; average reported return on investment is 3.7x (U.S. Chamber of Commerce, 2026; McKinsey, 2026)</li>
<li>18–25% average cost savings where AI is built into core workflows (McKinsey, 2025)</li>
<li>Most of those savings come from tasks like the ones you've done today</li>
</ul>
<p><em>These figures come from businesses in general, outside health care. Read them as a direction of travel; they don't tell us what's true in clinics today.</em></p>

<h2 id="patient-personas">Patient personas</h2>
<ul>
<li><strong>A persona</strong> : a description of one typical person in a group you want to reach, e.g. their age, work, worries, what they search for and what stops them booking or engaging</li>
<li>Marketing teams use them so every piece of content is written for someone in particular rather than a generic cohort</li>
<li>You know some of this from your own patients; AI can fill in the gaps, and you correct what it gets wrong</li>
<li>Everything else in this session builds on the persona: the content, the voice, the website, the new service</li>
</ul>

<h2 id="build-a-persona">Build a persona</h2>
<p><strong>With the AI</strong> (10 minutes)</p>
<blockquote>
<p>I'm a [profession] in [Montreal / your area]; I mostly see [groups X and Y]. I'd like to see more [group Z], and here's what I know about them: [your notes from step 3]. Build this group out as a full persona: who they are, what they'd search for at 9pm when the problem flares, what would make them book, what would stop them. Ask me questions before you start.</p>
</blockquote>
<ul>
<li>Four parts: <strong>who you are</strong>, <strong>the group</strong>, <strong>what you want back</strong>, <strong>an instruction to question you</strong></li>
<li>Adapt the wording to your own practice</li>
</ul>
</section>

<h2 id="content-for-that-person">Content for that person</h2>
<blockquote>
<p>I've attached a persona representing a group I'd like to see more of. Draft a blog post or a service page for our website, written for this person, that answers the question they'd be searching for. Professional but conversational, under 500 words.</p>
</blockquote>
<ul>
<li>They aren't your patients yet, so write for where they'll find you: your website, a blog post, a social media post</li>
<li>The persona's details are partly invented; edit them to match what you know, and the content improves as the persona does</li>
</ul>

<h2 id="teach-it-your-voice">Teach it your voice</h2>
<blockquote>
<p>I've attached three things I've written: a patient email, a website page and a social media post. Describe how my writing comes across: its main characteristics, what it seems to be trying to achieve, and how it would make a reader feel. Then rewrite the draft so it does the same.</p>
</blockquote>
<ul>
<li>You don't need to describe your own voice; let AI describe it from your examples</li>
<li>Correct anything that doesn't sound like you, or add how you'd like a reader to feel; feed this back to the AI</li>
<li>Keep the description, and paste it into future prompts</li>
</ul>
</section>

<h2 id="your-website-from-another-perspective">Your website, from another perspective</h2>
<blockquote>
<p>I've attached screenshots of our clinic homepage. Review it as if you were a prospective patient in pain, deciding whether to book. Tell me: what service do you think we offer, what would make you hesitate, and where do you get stuck? Then rank five changes by their likely effect on bookings.</p>
</blockquote>
<ul>
<li>Screenshots let it read the page as a page: what you see first, what competes for attention, where the booking button is</li>
<li>If your free tier limits uploads, paste the page text instead</li>

<h2 id="session-4-summary">Session 4: Summary</h2>
<ul>
<li>A persona turns &quot;our patients&quot; into one person you can write for; AI fills the gaps and you correct them</li>
<li>Let AI describe your voice from your own writing, then keep the description for future prompts</li>
<li>One piece of writing can become several formats in a single prompt</li>
<li>Screenshots let AI look at your website the way a prospective patient would</li>
<li>For a bigger idea, like a new service, let AI interview you before it drafts anything</li>
</ul>
<p>The habit to keep: write for one person.</p>
</section>

<header>§07 · patients' AI</header>

<h1 id="your-patients-use-ai-too">Your patients use AI too</h1>
<ul>
<li><strong>Before they see you</strong> : many patients have already asked an AI about their symptoms</li>
<li><strong>In the session</strong> : they bring what it said, and some trust it more than you might expect</li>
<li><strong>Your part</strong> : how you respond shapes the relationship, and you can help them use it better</li>
</ul>
</section>

<h2 id="patients-value-ai-guidance">Patients value AI guidance</h2>
<ul>
<li>Patients are arriving with a second opinion that didn't come from a human, and increasingly, they trust it</li>
<li>It's useful to them and imperfect, like much of the health advice they already get from friends, forums and social media</li>
<li>It's there when you aren't: at 9pm when the pain flares, with unlimited time and patience</li>
<li>Responding to this well is becoming part of clinical practice</li>
</ul>
</section>

<h2 id="when-a-patients-ai-disagrees">When a patient's AI disagrees</h2>
<p>A patient starts a session with: &quot;ChatGPT told me my pain is a disc problem and I shouldn't be exercising.&quot;</p>
<ul>
<li>What's your honest first instinct, and what would the patient take from it?</li>
<li>What might the AI not know about this person that you do?</li>
<li>How do you want the conversation to land, so they keep coming back to you?</li>
<li>Engaging with <em>why</em> you disagree, e.g. what the AI couldn't know about them, protects trust better than dismissing it (Telehealth.org, 2026)</li>
</ul>
</section>

<h2 id="turn-it-into-a-guide-for-your-team">Turn it into a guide for your team</h2>
<blockquote>
<p>Draft three ways I could respond that take their research seriously while explaining what the AI couldn't know about them. Then turn the best one into a one-page guide, split by role: reception and clinician.</p>
</blockquote>
<ul>
<li>Everyone in the clinic will meet this conversation, at the front desk as well as in treatment</li>
<li>Agree the response as a team, so a patient hears the same message from whoever they speak to</li>
</ul>
</section>

<h2 id="teach-patients-to-ask-ai-well">Teach patients to ask AI well</h2>
<p>Knowing how to ask an AI about your health is part of health literacy now. You can teach it the way you teach any self-management skill:</p>
<ul>
<li><strong>Ask open questions</strong> : &quot;What else could explain this?&quot; gets more than &quot;Could this be a disc?&quot;</li>
<li><strong>Give useful context</strong> : age, what's changed, what they've already tried</li>
<li><strong>Share carefully</strong> : leave out names and anything else that identifies them, and check the app's privacy settings</li>
<li><strong>Bring it back</strong> : show you what the AI said, so you can work with it together</li>
</ul>
<p>They're the habits you practised today, passed on.</p>
</section>

<h2 id="read-review-correct-approve">Read, review, correct, approve</h2>
<p>Kinatex's rule for Plume works for any AI tool:</p>
<ul>
<li><strong>Read it in full</strong></li>
<li><strong>Review it critically</strong></li>
<li><strong>Correct it</strong> where it needs correcting</li>
<li><strong>Approve it</strong> yourself, before it goes into a record or to anyone else</li>
</ul>
<p>Whoever or whatever drafted it, the note, the recommendation or the report is yours (Kinatex, Procédure encadrant le logiciel Plume).</p>
</section>
