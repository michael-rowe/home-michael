<h2 id="ai-has-become-an-agent">AI has become an agent</h2>
<ul>
<li>Memory : keeps what you've told it across conversations</li>
<li>Planning : breaks a goal into steps and works through them</li>
<li>Action : searches, reads documents, drafts, fills in forms</li>
<li>Checking : reviews its own work and adjusts</li>
</ul>
<p>These are already built into ChatGPT, Claude and Gemini, on the phones of your colleagues and the families you see (Weng, 2023).</p>

<header><strong>§01 what agents can do</strong> <em>§02 responding to AI</em> <em>§03 care as a system</em> <em>§04 the family's agent</em> <em>§05 you and your team</em></header>

<h2 id="in-tests-and-simulations-ai-now-works-at-a-clinical-level">In tests and simulations, AI now works at a clinical level</h2>
<ul>
<li>A diagnostic AI took histories and reached diagnoses in simulated consultations at least as well as primary care doctors (Tu et al., 2025)</li>
<li>Doctors working with GPT-4 reached the same standard as GPT-4 working alone (Goh et al., 2025)</li>
<li>ChatGPT and DeepSeek answered 60 rehabilitation questions, including on multiple sclerosis, to a standard rated above that of final-year physiotherapy students (Michou et al., 2026)</li>
<li>AI replies were rated more empathetic than clinicians' in 13 of 15 studies (Howcroft et al., 2025)</li>
</ul>
<p>On written cases and exam questions, AI now works at the level we expect of qualified clinicians.</p>
</section>

<h2 id="in-real-care-the-evidence-points-the-same-way">In real care, the evidence points the same way</h2>
<ul>
<li>Emergency department second opinions : the right diagnosis at triage in 66% of cases, where the two attending physicians on the same cases reached 54% and 48% (Brodeur et al., 2026a)</li>
<li>Primary care : 100 patients took a pre-visit history with an AI; the final diagnosis was on its list in 90% of cases (Brodeur et al., 2026b)</li>
<li>Nursing : an AI that reads patterns in nurses' documentation; 35.6% lower risk of in-hospital death across 74 units (Rossetti et al., 2025)</li>
</ul>
<p>The evidence is moving from test cases to real patients and clinical records, and the results are holding up.</p>

<h2 id="why-people-with-the-ai-did-worse">Why people with the AI did worse</h2>
<ul>
<li>People left out details that mattered<br /><span class="note">The AI can only reason from what it's told</span></li>
<li>They asked closed questions: <em>&quot;Could this be stress?&quot;</em><br /><span class="note">A yes-or-no question limits what the AI can say back</span></li>
<li>The AI often suggested the right answer, and people didn't pick it<br /><span class="note">It offered two or three conditions; choosing between them takes clinical knowledge</span></li>
<li>Two people describing the same brain bleed got opposite advice<br /><span class="note">Only one of them said the headache came on suddenly</span></li>
</ul>
<p>Taking a history is a clinical skill, whoever is asking the questions.</p>
</section>

<h2 id="agents-work-better-with-more-context">Agents work better with more context</h2>
<ul>
<li>An agent that knows the child's history, medicines and care plan gives better answers than one starting blank</li>
<li>Families are already giving it that context: letters, test results, seizure diaries, photos</li>
<li>More context brings more risk with children : someone else decides what's shared about them, and it can stay with the platform into adulthood</li>
</ul>
<p>Context is what makes agents useful, so it's worth deciding on purpose what goes in (Rowe &amp; Lynch, 2025).</p>
</section>

<h2 id="what-people-tell-me-theyre-worried-about">What people tell me they're worried about</h2>
<ul>
<li>Being replaced : will there be a role for me in ten years?</li>
<li>Getting it wrong : what if I trust an output I shouldn't?</li>
<li>Losing skill : what happens to my judgement if I stop practising it?</li>
<li>Falling behind : everyone else seems to know how to use this</li>
</ul>

<h2 id="sanctuary-strategies">Sanctuary strategies</h2>
<ul>
<li>Denial : <em>&quot;It can't replace the therapeutic relationship.&quot;</em> In some contexts, it has</li>
<li>Retreat : <em>&quot;Focus on what only humans can do.&quot;</em> A shrinking island</li>
<li>Restriction : <em>&quot;Don't let clinicians use it.&quot;</em> They will, because it's useful</li>
<li>Resignation : <em>&quot;Our roles will diminish.&quot;</em> Helplessness that sounds like realism</li>
</ul>
<p>All four leave you watching something happen to you.</p>

<h2 id="better-than-or-better-with">Better than, or better with?</h2>
<ul>
<li>Most studies ask whether AI is better than us</li>
<li>A colleague who's better than you at something is someone you learn from</li>
<li>AI feels different because it seems to threaten our expertise, our status and our autonomy (Jussupow et al., 2018)</li>
<li>Those are concerns about ourselves, and they pull our attention away from the child and family</li>
<li>The question that keeps the child at the centre: what could you and the AI reach together that neither reaches alone?</li>
</ul>
</section>

<h2 id="care-already-happens-in-a-system">Care already happens in a system</h2>
<ul>
<li>Clinical reasoning has always been shared, across people, records, protocols and places (Hutchins, 1995)</li>
<li>Your judgement and your colleagues', the hospital's records and decision support, the family's knowledge of their child</li>
<li>And now the family's AI, and yours</li>
<li>Your skill is managing that system: what to trust, how to reconcile conflicts, owning the synthesis</li>
</ul>
<p>What matters is whether the whole system produces good outcomes for the child.</p>
</section>

<h2 id="what-you-can-help-families-do">What you can help families do</h2>
<ul>
<li>Ask open questions : <em>&quot;What else could explain this?&quot;</em> gets more than <em>&quot;Could this be stress?&quot;</em></li>
<li>Give useful context : age, diagnosis, medicines, what's changed and what's already been tried</li>
<li>Share carefully : leave out names, dates of birth and anything else that identifies the child, and check the app's privacy settings</li>
<li>Bring it back : show the team what the AI said, so you can work with it together</li>
</ul>
<p>You're helping them take a better history, with the AI listening.</p>
</section>

<h2 id="the-familys-agent-in-the-mdt">The family's agent in the MDT</h2>
<ul>
<li>Families are building a record of their child's history, symptoms and worries, in conversations you may never see</li>
<li>They may arrive knowing things about their child that your notes don't</li>
<li>They bring that agent into the MDT, and so will each of you</li>
<li>Each agent carries the priorities of the person it works for</li>
</ul>
<p>The therapeutic relationship is still there; what it includes has changed.</p>
