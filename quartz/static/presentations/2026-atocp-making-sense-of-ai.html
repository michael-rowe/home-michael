<h1 id="making-sense-of-ai-in-clinical-practice">Making sense of AI <strong>in clinical practice</strong></h1>
<p>After this session you will be able to say what your patients' use of AI changes in the consultation — and what to do about it on Monday.</p>
<footer>atocp · boa annual congress · london   <em>2026-09-24</em></footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-class="center" data-theme="michael" lang="en-GB" class="center" style="--class:center;--theme:michael;">
<h2 id="in-head-to-head-studies-ai-diagnosed-more-accurately-than-doctors-gave-better-rated-moral-advice-than-an-expert-ethicist-and-answered-patients-questions-in-replies-clinicians-rated-more-empathetic-than-doctors">In head-to-head studies, AI diagnosed more accurately than doctors, gave better-rated moral advice than an expert ethicist, and answered patients' questions in replies clinicians rated <strong>more empathetic than doctors'</strong>.</h2>
<p>That was 2023 and 2024.</p>
<p><code>Tu et al., 2024 · Ayers et al., 2023 · Wilbanks et al., 2024</code></p>
</section>

<h2 id="when-technology-gets-in-the-way">When technology gets in the way</h2>
<blockquote>
<p>There are many reasons for slow adoption of the <strong>stethoscope</strong> — among which are lack of formal education, hesitancy of the patient and physician to have an instrument placed between them, and lack of opportunities for continuing education after leaving medical school.</p>
</blockquote>
<p>The stethoscope was resisted not because clinicians were ignorant but because it <strong>placed something between the clinician and the patient</strong>.</p>
<p><code>Reinhart, 2020</code></p>
</section>

<h2 id="frontier-ai-capabilities">Frontier AI capabilities</h2>
<ul>
<li><strong>Long context</strong>: reason across very large bodies of text</li>
<li><strong>Multimodal</strong>: read scans, figures, audio and video</li>
<li><strong>Deep research</strong>: synthesise evidence from many sources</li>
<li><strong>Tool use</strong>: search, run code, read PDFs, build prototypes</li>
<li><strong>Domain reasoning</strong>: postgraduate level in most disciplines</li>
<li><strong>Agents</strong>: work autonomously for hours; task length doubling every ~7 months</li>
</ul>
<p><code>Kwa et al., 2025</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="**§01 what the tools do** *§02 the fears* *§03 what you bring* *§04 agency on both sides* *§05 tomorrow, do this*" data-theme="michael" lang="en-GB" data-marpit-pagination="5" style="--paginate:true;--header:**§01 what the tools do** *§02 the fears* *§03 what you bring* *§04 agency on both sides* *§05 tomorrow, do this*;--theme:michael;" data-marpit-pagination-total="29">

<h2 id="ai-in-clinical-practice">AI in clinical practice</h2>
<ul>
<li><strong>Diagnosis</strong>: matching or exceeding specialists across clinical domains</li>
<li><strong>Expert–novice gap</strong>: narrows it, whatever the user's experience</li>
<li><strong>Errors</strong>: AI errors and human errors are different errors</li>
<li><strong>Communication</strong>: replies rated more helpful and more empathetic than physicians'</li>
</ul>
<p><code>Tu et al., 2024 · Dell'Acqua et al., 2023 · Lenskjold et al., 2023 · Ayers et al., 2023</code></p>

<h2 id="ai-in-physiotherapy">AI in physiotherapy</h2>
<ul>
<li><strong>MSK reasoning</strong>: comparable to specialists on clinical reasoning tasks</li>
<li><strong>Movement analysis</strong>: gait classified from mobile phone video</li>
<li><strong>Documentation</strong>: AI scribes add 24% more time with the patient</li>
<li><strong>Rehabilitation</strong>: programmes personalised from patient history</li>
<li><strong>Remote care</strong>: AI-guided physio with ~85% patient satisfaction</li>
</ul>
<p><code>Hao et al., 2025 · Reddy, 2025 · GOSH, 2025 · Michou, 2026 · Flok Health</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="*§01 what the tools do* **§02 the fears** *§03 what you bring* *§04 agency on both sides* *§05 tomorrow, do this*" data-theme="michael" lang="en-GB" data-marpit-pagination="9" style="--paginate:true;--header:*§01 what the tools do* **§02 the fears** *§03 what you bring* *§04 agency on both sides* *§05 tomorrow, do this*;--theme:michael;" data-marpit-pagination-total="29">
<header><em>§01 what the tools do</em> <strong>§02 the fears</strong> <em>§03 what you bring</em> <em>§04 agency on both sides</em> <em>§05 tomorrow, do this</em></header>

<h2 id="sanctuary-strategies">Sanctuary strategies</h2>
<ul>
<li><strong>Denial</strong>: <em>&quot;It can't replicate the therapeutic relationship.&quot;</em> Ignores the evidence</li>
<li><strong>Retreat</strong>: <em>&quot;Focus on what only humans can do.&quot;</em> A shrinking island</li>
<li><strong>Restriction</strong>: <em>&quot;Don't let clinicians use it.&quot;</em> They will, because it helps</li>
<li><strong>Resignation</strong>: <em>&quot;Our roles will diminish.&quot;</em> Helplessness dressed as realism</li>
</ul>
<p>All four position you as a <strong>spectator of something happening to you</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-header="*§01 what the tools do* **§02 the fears** *§03 what you bring* *§04 agency on both sides* *§05 tomorrow, do this*" data-class="center" data-theme="michael" lang="en-GB" class="center" style="--header:*§01 what the tools do* **§02 the fears** *§03 what you bring* *§04 agency on both sides* *§05 tomorrow, do this*;--class:center;--theme:michael;">
<header><em>§01 what the tools do</em> <strong>§02 the fears</strong> <em>§03 what you bring</em> <em>§04 agency on both sides</em> <em>§05 tomorrow, do this</em></header>

<h2 id="the-question-isnt-whether-ai-changes-practice-it-already-has-its-whether-you-shape-that-change">The question isn't whether AI changes practice. It already has. <strong>It's whether you shape that change.</strong></h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="*§01 what the tools do* *§02 the fears* **§03 what you bring** *§04 agency on both sides* *§05 tomorrow, do this*" data-theme="michael" lang="en-GB" data-marpit-pagination="11" style="--paginate:true;--header:*§01 what the tools do* *§02 the fears* **§03 what you bring** *§04 agency on both sides* *§05 tomorrow, do this*;--theme:michael;" data-marpit-pagination-total="29">
<header><em>§01 what the tools do</em> <em>§02 the fears</em> <strong>§03 what you bring</strong> <em>§04 agency on both sides</em> <em>§05 tomorrow, do this</em></header>

<h2 id="what-ai-systems-lack">What AI systems lack</h2>
<ul>
<li><strong>Stateless</strong>: no memory between sessions; you are a stranger every time</li>
<li><strong>Static</strong>: knowledge frozen at training; no awareness of your field since</li>
<li><strong>Contextless</strong>: no understanding of your expertise, patient population or reasoning patterns</li>
<li><strong>Context is the bottleneck</strong>: model intelligence may matter less than context</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="*§01 what the tools do* *§02 the fears* **§03 what you bring** *§04 agency on both sides* *§05 tomorrow, do this*" data-theme="michael" lang="en-GB" data-marpit-pagination="12" style="--paginate:true;--header:*§01 what the tools do* *§02 the fears* **§03 what you bring** *§04 agency on both sides* *§05 tomorrow, do this*;--theme:michael;" data-marpit-pagination-total="29">
<header><em>§01 what the tools do</em> <em>§02 the fears</em> <strong>§03 what you bring</strong> <em>§04 agency on both sides</em> <em>§05 tomorrow, do this</em></header>
<h2 id="context-sovereignty">Context sovereignty</h2>
<p>You control your professional context, and use it to shape what AI does for you.</p>
<ul>
<li>Your CPD, specialisms and interests, structured for AI</li>
<li>Context that accumulates as you work</li>
<li>Portable across any AI provider</li>
</ul>
<blockquote>
<p>What value do I bring? What value will I always bring?</p>
</blockquote>
<p><code>Rowe &amp; Lynch, 2025</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-header="§03 · what you bring" data-class="section" data-theme="michael" lang="en-GB" class="section" style="--header:§03 · what you bring;--class:section;--theme:michael;">
<header>§03 · what you bring</header>

<h1 id="you-bring-context-that-ai-doesnt-have">You bring context that AI doesn't have</h1>
<p><code>your specialism</code> <code>your patient population</code> <code>local services and pathways</code> <code>your CPD priorities</code> <code>how you reason</code> <code>what you've seen work</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="*§01 what the tools do* *§02 the fears* **§03 what you bring** *§04 agency on both sides* *§05 tomorrow, do this*" data-theme="michael" lang="en-GB" data-marpit-pagination="14" style="--paginate:true;--header:*§01 what the tools do* *§02 the fears* **§03 what you bring** *§04 agency on both sides* *§05 tomorrow, do this*;--theme:michael;" data-marpit-pagination-total="29">
<header><em>§01 what the tools do</em> <em>§02 the fears</em> <strong>§03 what you bring</strong> <em>§04 agency on both sides</em> <em>§05 tomorrow, do this</em></header>
<h2 id="what-are-agents">What are agents?</h2>
<ul>
<li><strong>Memory</strong>: retains context across time — your history, preferences, clinical patterns, previous decisions</li>
<li><strong>Planning</strong>: sets goals and sequences actions, not just responding to prompts</li>
<li><strong>Action</strong>: retrieves records, drafts notes, books follow-ups</li>
<li><strong>Reflection</strong>: evaluates its own outputs and adjusts</li>
</ul>
<blockquote>
<p>From a tool you use to a system acting on your behalf.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="*§01 what the tools do* *§02 the fears* **§03 what you bring** *§04 agency on both sides* *§05 tomorrow, do this*" data-theme="michael" lang="en-GB" data-marpit-pagination="15" style="--paginate:true;--header:*§01 what the tools do* *§02 the fears* **§03 what you bring** *§04 agency on both sides* *§05 tomorrow, do this*;--theme:michael;" data-marpit-pagination-total="29">
<header><em>§01 what the tools do</em> <em>§02 the fears</em> <strong>§03 what you bring</strong> <em>§04 agency on both sides</em> <em>§05 tomorrow, do this</em></header>
<h2 id="distributed-cognition">Distributed cognition</h2>
<ul>
<li>Clinical reasoning has never been a solo act</li>
<li>It is spread across <strong>people</strong>, <strong>artefacts</strong> and <strong>environments</strong></li>
<li>Your skill is managing that system: what to trust, how to reconcile conflicts, owning the synthesis</li>
<li><strong>AI changes the system's composition, not its nature</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-header="*§01 what the tools do* *§02 the fears* **§03 what you bring** *§04 agency on both sides* *§05 tomorrow, do this*" data-class="center" data-theme="michael" lang="en-GB" class="center" style="--header:*§01 what the tools do* *§02 the fears* **§03 what you bring** *§04 agency on both sides* *§05 tomorrow, do this*;--class:center;--theme:michael;">
<header><em>§01 what the tools do</em> <em>§02 the fears</em> <strong>§03 what you bring</strong> <em>§04 agency on both sides</em> <em>§05 tomorrow, do this</em></header>

<h2 id="knowing-things-about-conditions-will-become-less-important-than-knowing-when-to-trust-the-outputs-of-ai-systems">&quot;Knowing things about conditions will become less important than <strong>knowing when to trust the outputs of AI systems</strong>.&quot;</h2>
<p><code>Rowe, Nicholls &amp; Shaw, 2022</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="*§01 what the tools do* *§02 the fears* **§03 what you bring** *§04 agency on both sides* *§05 tomorrow, do this*" data-theme="michael" lang="en-GB" data-marpit-pagination="17" style="--paginate:true;--header:*§01 what the tools do* *§02 the fears* **§03 what you bring** *§04 agency on both sides* *§05 tomorrow, do this*;--theme:michael;" data-marpit-pagination-total="29">
<header><em>§01 what the tools do</em> <em>§02 the fears</em> <strong>§03 what you bring</strong> <em>§04 agency on both sides</em> <em>§05 tomorrow, do this</em></header>
<h2 id="professional-context-today">Professional context today</h2>
<ul>
<li>What does an AI know about your specialist area and clinical interests?</li>
<li>What does it know about the patient populations you work with?</li>
<li>What does it know about your CPD trajectory and the gaps you're working on?</li>
<li>What would it need to know to give you genuinely useful clinical support rather than generic output?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-header="§04 · agency on both sides" data-class="section" data-theme="michael" lang="en-GB" class="section" style="--header:§04 · agency on both sides;--class:section;--theme:michael;">
<header>§04 · agency on both sides</header>

<h1 id="context-sovereignty-applies-to-your-patients-too">Context sovereignty applies to your patients too</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="*§01 what the tools do* *§02 the fears* *§03 what you bring* **§04 agency on both sides** *§05 tomorrow, do this*" data-theme="michael" lang="en-GB" data-marpit-pagination="19" style="--paginate:true;--header:*§01 what the tools do* *§02 the fears* *§03 what you bring* **§04 agency on both sides** *§05 tomorrow, do this*;--theme:michael;" data-marpit-pagination-total="29">
<header><em>§01 what the tools do</em> <em>§02 the fears</em> <em>§03 what you bring</em> <strong>§04 agency on both sides</strong> <em>§05 tomorrow, do this</em></header>

<h2 id="patients-are-already-using-ai">Patients are already using AI</h2>
<ul>
<li>Patients use AI to research diagnoses, interpret symptoms, prepare questions and seek second opinions — <strong>before</strong> the appointment</li>
<li>Some arrive having already formed a view of their situation</li>
<li>The instinctive clinical response treats this as a problem to manage rather than an opportunity</li>
</ul>
<blockquote>
<p>These are patients exercising agency over their own health.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="*§01 what the tools do* *§02 the fears* *§03 what you bring* **§04 agency on both sides** *§05 tomorrow, do this*" data-class="image" data-theme="michael" lang="en-GB" class="image" data-marpit-pagination="20" style="--paginate:true;--header:*§01 what the tools do* *§02 the fears* *§03 what you bring* **§04 agency on both sides** *§05 tomorrow, do this*;--class:image;--theme:michael;" data-marpit-pagination-total="29">

<header><em>§01 what the tools do</em> <em>§02 the fears</em> <em>§03 what you bring</em> <strong>§04 agency on both sides</strong> <em>§05 tomorrow, do this</em></header>
<h2 id="from-passive-observation-to-active-support">From passive observation to active support</h2>
<p><strong>Conventional</strong>: react when patients arrive with AI-generated information.</p>
<p><strong>Emerging</strong>: support better AI use before the encounter.</p>
<blockquote>
<p>Before your next appointment, ask your AI: what questions should I be asking about my progress with [condition]? What should I understand about the next phase of treatment?</p>
</blockquote>
<p>This is health literacy for the AI age.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="*§01 what the tools do* *§02 the fears* *§03 what you bring* **§04 agency on both sides** *§05 tomorrow, do this*" data-theme="michael" lang="en-GB" data-marpit-pagination="22" style="--paginate:true;--header:*§01 what the tools do* *§02 the fears* *§03 what you bring* **§04 agency on both sides** *§05 tomorrow, do this*;--theme:michael;" data-marpit-pagination-total="29">
<header><em>§01 what the tools do</em> <em>§02 the fears</em> <em>§03 what you bring</em> <strong>§04 agency on both sides</strong> <em>§05 tomorrow, do this</em></header>
<h2 id="patient-context-sovereignty">Patient context sovereignty</h2>
<blockquote>
<p>Patients are building relationships with personal health AI <strong>that you may never see</strong>.</p>
</blockquote>
<ul>
<li>Their agents track history, symptoms, concerns and goals</li>
<li>That context accumulates over time, just as yours does</li>
<li><strong>They may arrive knowing more about themselves than your clinical record does</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="*§01 what the tools do* *§02 the fears* *§03 what you bring* **§04 agency on both sides** *§05 tomorrow, do this*" data-class="snug" data-theme="michael" lang="en-GB" class="snug" data-marpit-pagination="23" style="--paginate:true;--header:*§01 what the tools do* *§02 the fears* *§03 what you bring* **§04 agency on both sides** *§05 tomorrow, do this*;--class:snug;--theme:michael;" data-marpit-pagination-total="29">
<header><em>§01 what the tools do</em> <em>§02 the fears</em> <em>§03 what you bring</em> <strong>§04 agency on both sides</strong> <em>§05 tomorrow, do this</em></header>

<h2 id="multi-stakeholder-relationships">Multi-stakeholder relationships</h2>
<p>The MDT is already a negotiation between professional contexts, expertise sets and institutional positions.</p>
<ul>
<li>All stakeholders bring their own agents into the MDT</li>
<li>Each agent carries its principal's values and priorities into the encounter</li>
<li>The encounter becomes a negotiation between context-rich positions</li>
</ul>
<blockquote>
<p>This doesn't replace the therapeutic relationship. It changes what the relationship is.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-header="*§01 what the tools do* *§02 the fears* *§03 what you bring* **§04 agency on both sides** *§05 tomorrow, do this*" data-class="center" data-theme="michael" lang="en-GB" class="center" style="--header:*§01 what the tools do* *§02 the fears* *§03 what you bring* **§04 agency on both sides** *§05 tomorrow, do this*;--class:center;--theme:michael;">
<header><em>§01 what the tools do</em> <em>§02 the fears</em> <em>§03 what you bring</em> <strong>§04 agency on both sides</strong> <em>§05 tomorrow, do this</em></header>

<h2 id="the-professionals-who-will-shape-ai-in-clinical-practice-are-those-who-bring-deliberate-context-to-it">The professionals who will shape AI in clinical practice are those who <strong>bring deliberate context to it</strong>.</h2>
</section>

<h2 id="%C2%A705--tomorrow-do-this">§05 · tomorrow, do this</h2>
<h3 id="write-down-your-professional-context">Write down your professional context</h3>
<p>Your specialisation, patient population, CPD priorities and how you reason — one page, explicit enough to give to an AI.</p>
<h3 id="give-one-patient-a-structured-prompt">Give one patient a structured prompt</h3>
<p><em>&quot;Before your next appointment, ask your AI what questions you should be asking about your progress.&quot;</em></p>
<h3 id="bring-judgement-not-deference">Bring judgement, not deference</h3>
<p>Read the next AI output you meet as you would a colleague's opinion: engaged, contextual, accountable.</p>
