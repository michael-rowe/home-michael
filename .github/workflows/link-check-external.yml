name: Check external links (weekly)

# Verifies outbound http(s) links across the built site. Runs on a schedule
# (and on demand) and is intentionally separate from deploy.yml: a red run
# here reports external link rot but never blocks a deploy.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Check external links
        run: |
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz" -o lychee.tar.gz
          echo "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5  lychee.tar.gz" | sha256sum -c -
          tar xzf lychee.tar.gz --strip-components=1 lychee-x86_64-unknown-linux-musl/lychee
          # Quartz emits root-relative URLs (/home-michael/...). Without a root
          # dir lychee cannot resolve them and reports "Cannot resolve
          # root-relative link" as an error, even though --scheme http/https is
          # meant to skip local links. Same symlink + --root-dir pairing the
          # deploy gate uses, so both workflows resolve paths identically.
          ln -sfn public home-michael
          # --scheme http/https restricts to external links (skips local file links,
          # which the deploy gate already covers). Retries + accepted codes reduce
          # noise from rate limiting and transient failures.
          #
          # Accepted codes beyond 2xx are anti-bot responses we can't act on, not
          # link rot: 202 (IEEE Xplore, reached via doi.org), 203 (PubMed),
          # 403 (publishers/DOIs blocking HEAD from non-browsers),
          # 405 (POST-only endpoints like the contact form rejecting GET),
          # 429 (rate limiting), 999 (LinkedIn's crawler block). Excluding
          # linkedin.com outright since every page footer links to it and it
          # always returns 999. This keeps a red run meaningful: a reachable-but-
          # broken link (404/410/5xx), not a bot wall.
          #
          # Two publisher hosts are excluded rather than accepted, because they
          # fail in ways no status code covers:
          #   sciencedirect.com — bounces through Elsevier SSO and lands on
          #     /user/error/ATN-20 with a 400 after five redirects.
          #   ajhpe.org.za — 302s to itself indefinitely; a hand check times
          #     out at 40s. The DOI is correct, the journal's site loops.
          #
          # Two further exclusions, both verified reachable by hand:
          #   figshare.uts.edu.au — serves an incomplete TLS chain (missing
          #     intermediate). curl fails with exit 60 and succeeds with -k;
          #     browsers fetch the intermediate via AIA and load it fine. It is
          #     reached through a doi.org redirect from a cited reference, so
          #     the link is correct and the fix belongs to UTS, not to us.
          #     Excluding the host rather than passing --insecure, which would
          #     disable certificate checking for every link in the run. The DOI
          #     itself is excluded too: exclusions match the URL found in the
          #     page, and the link on the page is the doi.org one, so a host
          #     exclusion alone never fires — lychee only reaches figshare
          #     after following the redirect.
          #   gemini.google.com — returns an HTTP/2 protocol error to lychee
          #     from the runner while returning 200 to curl over both HTTP/2
          #     and HTTP/1.1. A client/runner artefact, not link rot.
          ./lychee --scheme http --scheme https --max-retries 3 \
            --root-dir "$PWD" \
            --accept 200,202,203,206,403,405,429,999 \
            --exclude 'linkedin\.com' \
            --exclude 'sciencedirect\.com' \
            --exclude 'ajhpe\.org\.za' \
            --exclude '10\.7196/AJHPE' \
            --exclude 'figshare\.uts\.edu\.au' \
            --exclude '10\.71741/4PYXMBNJAQ\.31302475' \
            --exclude 'gemini\.google\.com' \
            --no-progress 'public/**/*.html'
